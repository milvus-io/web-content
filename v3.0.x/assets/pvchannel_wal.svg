<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="1404" viewBox="0 0 2280 1404" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">VChannel, PChannel, and Streaming Node relationships</title>
  <desc id="diagram-description">Two example groups show a WAL in WAL Storage connected to a Streaming Node and a PChannel inside Milvus. Each PChannel has a 1:N relationship with VChannels, illustrated by three VChannels. Each VChannel connects to a stack of two Message boxes and an ellipsis, representing additional messages. The two groups and three VChannels per group are examples, not fixed limits.</desc>
