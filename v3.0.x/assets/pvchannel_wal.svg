      <path d="M 1 1 L 11 11 L 1 21" fill="none" stroke="#9CA6B4" stroke-width="3" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect id="background" width="2280" height="1404" fill="#F6F8FA"/>
